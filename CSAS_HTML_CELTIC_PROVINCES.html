<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celtic Provinces</title>
  <style>
    :root {
      --primary: #2f6b4f;
      --background: #f4f7f5;
      --text: #1f2924;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    header {
      padding: 1.5rem;
      color: white;
      background: var(--primary);
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 0.75rem;
      background: white;
      border-bottom: 1px solid #d7dfda;
    }

    nav a {
      color: var(--primary);
      font-weight: bold;
      text-decoration: none;
    }

    main {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }

    section {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: white;
      border-radius: 8px;
    }

    footer {
      padding: 1rem;
      text-align: center;
      background: #e1e8e4;
    }
  </style>
</head>
<body>
  <header>
    <h1>Celtic Provinces</h1>
  </header>

  <nav aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>

  <main>
    <section id="home">
      <h2>Welcome</h2>
      <p>This is a basic website template.</p>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>Add information about Celtic provinces here.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Add contact information here.</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Celtic Provinces</p>
  </footer>
</body>
</html>
